map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}
map $uri $shell_cache {
    default '';
    /index.html 'no-cache';
}

log_format shell_http '$remote_addr $request_method $uri $status $body_bytes_sent';

server {
    access_log /var/log/nginx/access.log shell_http;
    listen 80;
    server_name _;
    root /srv;
    index index.html;
    server_tokens off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api app:8081;
    set $room app:18102;
    client_max_body_size 64m;
    gzip on;
    gzip_types application/javascript application/json text/css image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control $shell_cache;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 1h;

    location ^~ /internal/ { return 404; }
    location ^~ /api/blok/sync/ { proxy_pass http://$room; }
    location ~ ^/(api/|files/|mcp$|healthz$) { proxy_pass http://$api; }
    location / { try_files $uri /index.html; }
}

# Loaded by demo.sh only while one existing page is assigned to Node.
services:
  node:
    environment:
      BLOK_NODE_ROOM_PAGE: ${BLOK_NODE_ROOM_PAGE:?Use demo.sh room-enable}
  app:
    environment:
      BLOK_NODE_ROOM_PAGE: ${BLOK_NODE_ROOM_PAGE:?Use demo.sh room-enable}
  room:
    image: ${COMPOSE_PROJECT_NAME:-blok-local}-room:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: room
    init: true
    network_mode: service:node
    restart: unless-stopped
    stop_grace_period: 90s
    command: ["/data/collab", "${BLOK_NODE_ROOM_PAGE:?Use demo.sh room-enable}", "http://localhost:${DEMO_WEB_PORT:-8088}", "18102"]
    environment:
      BLOK_ROOM_CLOUD_ORIGIN: http://127.0.0.1:8080
      BLOK_ROOM_PROJECTION_ORIGIN: http://127.0.0.1:8081
      INTERNAL_SECRET: ${INTERNAL_SECRET:?Run demo.sh first}
      ALLOWED_ORIGINS: tauri://localhost,http://tauri.localhost,https://tauri.localhost
    volumes:
      - state:/data
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:18102/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 4s
      retries: 30

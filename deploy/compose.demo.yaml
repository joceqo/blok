      MAIL_DIRECTORY: /data/mail
    volumes:
      - ./local-mailbox.py:/scripts/local-mailbox.py:ro
      - state:/data:ro
    ports:
      - '127.0.0.1:${DEMO_MAIL_PORT:-8089}:8025'
  seed:
    image: ${COMPOSE_PROJECT_NAME:-blok-local}-app:local
    pull_policy: never

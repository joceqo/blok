name: blok-local
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: blok
      POSTGRES_USER: blok
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run demo.sh first}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U blok -d blok']
      interval: 3s
      timeout: 5s
      retries: 30
  node:
    build:
      context: ../apps/service-node
    init: true
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://blok:${POSTGRES_PASSWORD}@postgres:5432/blok
      INTERNAL_SECRET: ${INTERNAL_SECRET:?Run demo.sh first}
      PUBLIC_URL: http://localhost:${DEMO_WEB_PORT:-8088}
      ALLOWED_ORIGINS: tauri://localhost,http://tauri.localhost,https://tauri.localhost
      TRUSTED_PROXY_CIDRS: ${DEMO_NETWORK_PREFIX:-172.30.88}.3/32
      BLOK_DEVELOPMENT: '1'
      PORT: '8081'
    networks:
      default:
        aliases: [app]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8081/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 30
  app:
    # The document callback carries a bearer secret and accepts HTTP only over loopback.
    network_mode: service:node
    image: ${COMPOSE_PROJECT_NAME:-blok-local}-app:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: service
    restart: unless-stopped
    init: true
    stop_grace_period: 90s
    environment:
      DATABASE_URL: postgres://blok:${POSTGRES_PASSWORD}@postgres:5432/blok?sslmode=disable
      PUBLIC_URL: http://localhost:${DEMO_WEB_PORT:-8088}
      INTERNAL_URL: http://127.0.0.1:8081
      LISTEN_ADDR: ':8080'
      DATA_DIRECTORY: /data
      AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY:-}
      APP_ENV: development
      # Le backend développement gagne AVANT Resend dans l'ordre de sélection
      # (mail.go), donc demo.sh le vide quand une clé Resend est présente —
      # sinon un vrai envoi serait impossible à observer ici.
      DEV_MAIL_DIRECTORY: ${DEV_MAIL_DIRECTORY-/data/mail}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-onboarding@resend.dev}
      # Vide avec `demo.sh start --setup` : l'instance démarre « setup requis »
      # et sert l'assistant. Sinon l'amorçage par variable, comme en production.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL-admin@example.test}
      BOOTSTRAP_WORKSPACE_SLUG: ${BOOTSTRAP_WORKSPACE_SLUG-equipe}
      BOOTSTRAP_WORKSPACE_NAME: ${BOOTSTRAP_WORKSPACE_NAME-Équipe}
      TICKET_SECRET: ${TICKET_SECRET:?Run demo.sh first}
      INTERNAL_SECRET: ${INTERNAL_SECRET:?Run demo.sh first}
      ALLOWED_ORIGINS: tauri://localhost,http://tauri.localhost,https://tauri.localhost
      TRUSTED_PROXY_CIDRS: ${DEMO_NETWORK_PREFIX:-172.30.88}.3/32
    volumes:
      - state:/data
    depends_on:
      node:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/healthz']
      interval: 3s
      timeout: 5s
      retries: 30
  web:
    image: ${COMPOSE_PROJECT_NAME:-blok-local}-web:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
      args:
        VITE_REACT_GRAB: "true"
    restart: unless-stopped
    environment:
      DOMAIN: ':80'
      BLOK_SHELL_READ_UPSTREAM: node:8081
      BLOK_SHELL_WRITE_UPSTREAM: node:8081
    networks:
      default:
        ipv4_address: ${DEMO_NETWORK_PREFIX:-172.30.88}.3
    ports:
      - '127.0.0.1:${DEMO_WEB_PORT:-8088}:80'
    depends_on:
      app:
        condition: service_healthy
      node:
        condition: service_healthy
  mailbox:
    image: python:3.13-alpine
    restart: unless-stopped
    command: [python, /scripts/local-mailbox.py]
    environment:
      MAIL_DIRECTORY: /data/mail
    volumes:
      - ./local-mailbox.py:/scripts/local-mailbox.py:ro
      - state:/data:ro
    ports:
      - '127.0.0.1:${DEMO_MAIL_PORT:-8089}:8025'
  seed:
    image: python:3.13-alpine
    profiles: [tools]
    command: [python, /scripts/seed-demo.py]
    environment:
      API_URL: http://web
      MAIL_DIRECTORY: /data/mail
    volumes:
      - ./seed-demo.py:/scripts/seed-demo.py:ro
      - state:/data:ro
volumes:
  postgres:
  state:
networks:
  default:
    ipam:
      config:
        - subnet: ${DEMO_NETWORK_PREFIX:-172.30.88}.0/24
          ip_range: ${DEMO_NETWORK_PREFIX:-172.30.88}.128/25
